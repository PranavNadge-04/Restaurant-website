<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Crave Restaurant</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <nav class="navbar">
    <h1 class="logo">Urban Crave</h1>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <div class="overlay">
    <h2>Luxury Dining Experience</h2>
    <p>Fine food. Elegant ambience.</p>
    <a href="services.html" class="btn">Explore Menu</a>
  </div>
</section>

<section class="features">
  <div class="feature">
    <img src="images/venue.jpg" loading="lazy">
    <h3>Premium Quality</h3>
  </div>
  <div class="feature">
    <img src="images/freshingredients.jpg" loading="lazy">
    <h3>Fresh Ingredients</h3>
  </div>
  <div class="feature">
    <img src="images/chefs.jpg" loading="lazy">
    <h3>Expert Chefs</h3>
  </div>
</section>

<section class="booking">
  <h2 id="booktabletitle">Reserve Your Table</h2>
  <form id="bookingForm">
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <input type="date" required>
    <input type="time" required><br>
    <button  id=bookbtn type="submit">Book Now</button>
  </form>
</section>

<footer>
  <p>© 2026 Urban Crave Restaurant</p>
</footer>

<script src="script.js"></script>
</body>
</html>
